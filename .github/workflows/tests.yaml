name: Tests

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-node@v6.5.0
      with:
        node-version: 24
        package-manager-cache: false

    - name: Enable Corepack
      run: |
        corepack enable
        corepack prepare yarn@4.18.0 --activate
        yarn --version

    - uses: calcit-lang/setup-calcit@v1.5.0
      with:
        tools: calcit,caps
        version: "0.28.0"
        caps-version: "0.1.1"

    - name: Install deps
      run: |
        caps --ci --strict
        yarn install --immutable
        caps verify --toolchain

    - name: Validate Calcit
      run: |
        calcit calcit.cirru edit format
        git diff --exit-code -- calcit.cirru
        yarn check-calcit
        calcit calcit.cirru analyze quality --baseline config/calcit-quality.cirru
        calcit calcit.cirru analyze dynamic-methods --summary-only --format json | jq -e '.data.summary.findings == 0'
        calcit calcit.cirru analyze check-public --ns memof.anchor --ns memof.once --ns memof.main --summary-only --format json
        calcit calcit.cirru analyze check-examples --ns memof.anchor
        calcit calcit.cirru analyze check-examples --ns memof.once

    - name: "run native entry"
      run: calcit calcit.cirru

    - name: "test js"
      run: |
        calcit calcit.cirru test --require-match --summary-only
        calcit calcit.cirru js
        node main.mjs
        node --test scripts/keyed-cache.test.mjs

    - name: "check docs markdown"
      run: yarn check-docs
