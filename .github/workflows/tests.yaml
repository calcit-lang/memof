name: Tests

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-node@v6.5.0
      with:
        node-version: 24
        package-manager-cache: false

    - name: Enable Corepack
      run: |
        corepack enable
        corepack prepare yarn@4.18.0 --activate
        yarn --version

    - uses: calcit-lang/setup-calcit@v1.5.0
      with:
        tools: calcit,caps
        deps-file: deps.cirru
        caps-version: "0.1.1"

    - name: Install deps
      run: |
        set -euo pipefail
        caps --ci --strict
        yarn install --immutable
        caps verify --toolchain

    - name: Validate Calcit
      run: |
        set -euo pipefail
        calcit calcit.cirru edit format
        git diff --exit-code -- calcit.cirru
        calcit calcit.cirru fix --workflow strict --verify --format json
        yarn check-calcit
        calcit calcit.cirru analyze quality --baseline config/calcit-quality.cirru
        calcit calcit.cirru analyze weak-types --only dynamic-method --summary-only --format json | jq -e '.data.summary.findings == 0'
        calcit calcit.cirru --check-only --ns memof.anchor --ns memof.once --ns memof.main --summary-only --format json
        calcit calcit.cirru analyze check-examples --ns memof.anchor
        calcit calcit.cirru analyze check-examples --ns memof.once

    - name: Load released definition-test runner
      uses: actions/checkout@v7.0.1
      with:
        repository: calcit-lang/calcit
        ref: 0.31.0-alpha.7
        path: .calcit/core-test-tools
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          /scripts/run-core-tests.mjs
          /scripts/core-test-protocol.mjs
          /scripts/core-tests-exclusions.cirru
          /docs/installation/wasm-support.md

    - name: "run native entry"
      run: calcit calcit.cirru

    - name: "test js"
      run: |
        set -euo pipefail
        export CALCIT_BIN="$(command -v calcit)"
        node .calcit/core-test-tools/scripts/run-core-tests.mjs \
          --snapshot calcit.cirru --entry default --backend native,js \
          --exclusions .calcit/core-test-tools/scripts/core-tests-exclusions.cirru \
          --support-matrix .calcit/core-test-tools/docs/installation/wasm-support.md
        calcit calcit.cirru js
        node main.mjs
        node --test scripts/keyed-cache.test.mjs

    - name: "check docs markdown"
      run: yarn check-docs
