name: Tests

on:
  push:
    branches:
      - main
  pull_request: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v6
      with:
        node-version: 24

    - name: Enable Corepack
      run: |
        corepack enable
        corepack prepare yarn@4.12.0 --activate
        yarn --version

    - uses: calcit-lang/setup-calcit@v1
      
    - name: Install deps
      run: |
        caps --ci --strict
        yarn install --immutable
        caps verify --toolchain

    - name: Validate Calcit
      run: |
        calcit calcit.cirru edit format
        git diff --exit-code -- calcit.cirru
        yarn check-calcit
        calcit calcit.cirru analyze quality --baseline config/calcit-quality.cirru
        calcit calcit.cirru analyze dynamic-methods --max 0 --summary-only
        calcit calcit.cirru analyze check-public --ns memof.anchor --ns memof.once --summary-only
        calcit calcit.cirru analyze check-examples --ns memof.anchor
        calcit calcit.cirru analyze check-examples --ns memof.once

    - name: "run native entry"
      run: calcit calcit.cirru

    - name: "test js"
      run: |
        calcit calcit.cirru test --require-match --summary-only
        calcit calcit.cirru js
        node main.mjs
        node --test scripts/keyed-cache.test.mjs

    - name: "check docs markdown"
      run: yarn check-docs
