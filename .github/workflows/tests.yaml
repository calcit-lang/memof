name: Tests

on:
  push:
    branches:
      - main
  pull_request: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v6
      with:
        node-version: 24

    - name: Enable Corepack
      run: |
        corepack enable
        corepack prepare yarn@4.12.0 --activate
        yarn --version

    - uses: calcit-lang/setup-calcit@v1
      
    - name: Install deps
      run: |
        caps --ci --strict
        yarn install --immutable
        caps verify --toolchain

    - name: Validate Calcit
      run: |
        calcit calcit.cirru edit format
        git diff --exit-code -- calcit.cirru
        yarn check-calcit
        mkdir -p .calcit/upgrade
        calcit calcit.cirru analyze check-types --summary-only --format json > .calcit/upgrade/check-types.json
        calcit calcit.cirru analyze weak-types --only schema-dynamic,code-dynamic,code-nil --intent unresolved,declared-optional --summary-only --format json > .calcit/upgrade/weak-types.json
        calcit calcit.cirru analyze deprecated --summary-only --format json > .calcit/upgrade/deprecated.json
        node scripts/check-calcit-upgrade-baseline.mjs

    - name: "run native entry"
      run: calcit calcit.cirru

    - name: "test js"
      run: calcit calcit.cirru js && node main.mjs

    - name: "check docs markdown"
      run: yarn check-docs
